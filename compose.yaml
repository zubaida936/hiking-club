# Local development stack. Run: docker compose up -d
name: hiking

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: hiking-app:dev
  volumes:
    - .:/var/www/html
    # Keep dependencies inside the Docker VM: reading thousands of files through the
    # Windows bind mount made every request take seconds.
    - vendor:/var/www/html/vendor
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"

  # Expo dev server for the mobile app (mobile/). Not started by `docker compose up -d`:
  # run `docker compose --profile mobile up -d mobile`, then open the app in Expo Go on a phone on the
  # same Wi-Fi. EXPO_HOST_IP (in .env) is this computer's Wi-Fi address, e.g. 192.168.1.20: the phone
  # reaches the dev server and the API through it (localhost on the phone is the phone itself).
  mobile:
    image: node:24-bookworm-slim
    profiles: [mobile]
    working_dir: /app/mobile
    volumes:
      - .:/app
      - mobile-node-modules:/app/mobile/node_modules
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST_IP:-127.0.0.1}
      EXPO_PUBLIC_API_URL: http://${EXPO_HOST_IP:-127.0.0.1}:${APP_PORT:-8080}/api/v1
      # Reads the API docs inside Docker to generate the app's API types (npm run api:types).
      API_DOCS_URL: http://nginx/docs/api.json
      CI: ${EXPO_CI:-false}
    # Port 8082: 8081 (Expo's default) is phpMyAdmin.
    # No QR code in `docker compose logs` (Expo prints it only in an interactive terminal): type the printed
    # address in Expo Go → "Enter URL manually". The "React Native DevTools" download warning is harmless.
    command:
      - sh
      - -c
      - "npm install --no-audit --no-fund && echo 'Open in Expo Go -> Enter URL manually: exp://${EXPO_HOST_IP:-127.0.0.1}:8082' && npx expo start --lan --port 8082"
    ports:
      - "8082:8082"
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
  redis-data:
  vendor:
  node-modules:
  mobile-node-modules:
