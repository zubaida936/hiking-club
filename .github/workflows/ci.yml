name: CI

# Runs on every pull request and on pushes to main. Branch protection on
# main should require all jobs below to pass before a PR can be merged.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: bcmath, exif, gd, intl, pdo_mysql, redis, zip

jobs:
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests (Pest + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hiking_testing
          MYSQL_USER: hiking
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: hiking
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Views call @vite, so the manifest must exist for HTTP tests.
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test --coverage --min=70

  mobile:
    name: Mobile app (lint, types, tests, Android bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Bundles the JavaScript for Android the way a release build does: catches import and config errors.
      - run: npx expo export --platform android --output-dir /tmp/expo-export

  api-types:
    name: Mobile API types match the API
    runs-on: ubuntu-latest
    # Scramble reads the table columns to type some fields, so it needs the migrated schema.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hiking_testing
          MYSQL_USER: hiking
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hiking_testing
      DB_USERNAME: hiking
      DB_PASSWORD: secret
      # No Redis in this job (.env.example uses it): same in-memory drivers as phpunit.xml.
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan scramble:export --path=storage/api.json
      # Same generator and version as `npm run api:types` in mobile/. A difference means the API changed:
      # run `npm run api:types` in the mobile container and commit mobile/src/api/schema.d.ts.
      - run: npx --yes openapi-typescript@7.13.0 storage/api.json -o mobile/src/api/schema.d.ts
      - run: git diff --exit-code mobile/src/api/schema.d.ts

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, static-analysis, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
