name: CD

# Builds the production image after CI succeeds on main and publishes it to
# GitHub Container Registry. Deployment waits for manual approval through
# the "production" environment (Settings -> Environments -> required reviewers).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Placeholder until the hosting target is chosen (VPS over SSH, Forge, etc.).
      # A typical VPS deploy: pull the image, then
      #   docker compose -f compose.prod.yaml up -d
      #   docker compose exec app php artisan migrate --force
      #   docker compose exec app php artisan db:seed --class=RolesAndPermissionsSeeder --force
      #   docker compose exec app php artisan optimize
      - run: echo "Deploy ${{ needs.publish.outputs.image }} (not configured yet)"
