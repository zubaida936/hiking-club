server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Compress text responses (HTML, CSS, JS, JSON, SVG, XML).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/ttf;

    location = /favicon.ico { access_log off; log_not_found off; }
    # Generated by Laravel (production-only indexing), see SeoController.
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    # Vite build output has content hashes in its file names: cache it "forever".
    location ^~ /build/ {
        # add_header here replaces the server-level ones, so repeat nosniff.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (event covers, gallery...). Served directly instead of a
    # public/storage symlink, which is unreliable on Windows bind mounts.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|avif|gif|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Re-resolve through Docker DNS so a recreated app container doesn't cause 502s.
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
